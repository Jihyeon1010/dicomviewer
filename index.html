<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DICOM Viewer</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <button id="open-files">Open files</button>
      <button id="open">Open folder</button>
    </div>

    <div class="group" id="tools" role="toolbar" aria-label="Mouse tools">
      <button class="tool" data-tool="window">W/L</button>
      <button class="tool" data-tool="pan">Pan</button>
      <button class="tool" data-tool="zoom">Zoom</button>
      <button class="tool" data-tool="scroll">Scroll</button>
    </div>

    <div class="group" id="measure-tools" role="toolbar" aria-label="Measurement tools">
      <button class="tool" data-tool="length">Length</button>
      <button class="tool" data-tool="angle">Angle</button>
      <button class="tool" data-tool="ellipse">Ellipse</button>
      <button class="tool" data-tool="rect">Rect</button>
    </div>

    <div class="group" id="layout-wrap">
      <button id="layout-btn" aria-haspopup="true" aria-expanded="false">Layout: 1 × 1</button>
      <div id="layout-pop" hidden>
        <div id="layout-grid"></div>
        <div id="layout-label"></div>
      </div>
    </div>

    <div class="group">
      <button id="sync-scroll">Sync scroll</button>
      <button id="sync-window">Sync W/L</button>
    </div>

    <div class="group">
      <select id="preset"></select>
      <button id="invert">Invert</button>
      <button id="fit">Fit</button>
      <button id="reset">Reset</button>
    </div>

    <div class="group">
      <button id="rot-ccw">Rot L</button>
      <button id="rot-cw">Rot R</button>
      <button id="flip-h">Flip H</button>
      <button id="flip-v">Flip V</button>
    </div>

    <div class="group">
      <button id="cine">Play</button>
    </div>

    <div class="group">
      <button id="info">Info: Full</button>
      <button id="markers">Markers</button>
      <button id="slider-pos">Slider: Bottom</button>
      <button id="anonymize">Anonymize</button>
      <button id="tags-btn">Tags</button>
      <button id="settings-open">Settings</button>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar">
      <h2>Series</h2>
      <ul id="series-list"></ul>
    </aside>

    <main id="stage">
      <div id="viewports" data-tool="window"></div>
      <div id="status"></div>
      <div id="slider-bar">
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="Image" />
      </div>
    </main>
  </div>

  <div id="settings-backdrop" hidden>
    <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="dialog-head">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" type="button">Close</button>
      </div>
      <div id="settings-body">
        <div class="section-head">
          <h3>Keyboard shortcuts</h3>
          <button id="keys-reset-all" type="button">Reset all</button>
        </div>
        <div id="keys-notice" role="status"></div>
        <div id="keys-list"></div>
      </div>
    </div>
  </div>

  <div id="tags-backdrop" hidden>
    <div id="tags" role="dialog" aria-modal="true" aria-labelledby="tags-title">
      <div class="dialog-head">
        <h2 id="tags-title">DICOM tags</h2>
        <button id="tags-close" type="button">Close</button>
      </div>
      <div id="tags-bar">
        <input id="tags-search" type="search" placeholder="Filter by tag, name or value" />
        <span id="tags-count"></span>
      </div>
      <div id="tags-note"></div>
      <div id="tags-list"></div>
    </div>
  </div>
</body>
</html>
