<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DICOM Viewer</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <button id="open-files"><span class="ic" data-icon="file"></span><span class="lbl">Files</span></button>
      <button id="open"><span class="ic" data-icon="folder"></span><span class="lbl">Folder</span></button>
    </div>

    <div class="group" id="tools" role="toolbar" aria-label="Mouse tools">
      <button class="tool ib" data-tool="window" aria-label="Window / Level"><span class="ic" data-icon="sliders"></span></button>
      <button class="tool ib" data-tool="pan" aria-label="Pan"><span class="ic" data-icon="move"></span></button>
      <button class="tool ib" data-tool="zoom" aria-label="Zoom"><span class="ic" data-icon="zoom"></span></button>
      <button class="tool ib" data-tool="scroll" aria-label="Scroll"><span class="ic" data-icon="scroll"></span></button>
    </div>

    <div class="group" id="measure-tools" role="toolbar" aria-label="Measurement tools">
      <button class="tool ib" data-tool="length" aria-label="Length"><span class="ic" data-icon="ruler"></span></button>
      <button class="tool ib" data-tool="angle" aria-label="Angle"><span class="ic" data-icon="angle"></span></button>
      <button class="tool ib" data-tool="ellipse" aria-label="Elliptical ROI"><span class="ic" data-icon="ellipse"></span></button>
      <button class="tool ib" data-tool="rect" aria-label="Rectangular ROI"><span class="ic" data-icon="rect"></span></button>
      <button class="tool ib" data-tool="aneurysm" aria-label="Aneurysm"><span class="ic" data-icon="aneurysm"></span></button>
      <button class="tool ib" data-tool="calibrate" aria-label="Calibrate length"><span class="ic" data-icon="calibrate"></span></button>
    </div>

    <div class="group" id="layout-wrap">
      <button id="layout-btn" aria-haspopup="true" aria-expanded="false">
        <span class="ic" data-icon="layout"></span><span class="lbl">1 × 1</span>
      </button>
      <div id="layout-pop" hidden>
        <div id="layout-grid"></div>
        <div id="layout-label"></div>
      </div>
    </div>

    <div class="group">
      <button id="tile"><span class="ic" data-icon="tile"></span><span class="lbl">Tile</span></button>
      <button id="sync-scroll"><span class="ic" data-icon="link"></span><span class="lbl">Scroll</span></button>
      <button id="sync-window"><span class="ic" data-icon="link"></span><span class="lbl">W/L</span></button>
    </div>

    <div class="group">
      <button id="mpr"><span class="ic" data-icon="mpr"></span><span class="lbl">MPR</span></button>
    </div>

    <div class="group">
      <select id="preset" aria-label="Window presets"></select>
      <button id="invert" class="ib" aria-label="Invert"><span class="ic" data-icon="contrast"></span></button>
      <button id="fit" class="ib" aria-label="Fit to window"><span class="ic" data-icon="fit"></span></button>
      <button id="reset" class="ib" aria-label="Reset window"><span class="ic" data-icon="undo"></span></button>
    </div>

    <div class="group">
      <button id="rot-ccw" class="ib" aria-label="Rotate counterclockwise"><span class="ic" data-icon="rotate-ccw"></span></button>
      <button id="rot-cw" class="ib" aria-label="Rotate clockwise"><span class="ic" data-icon="rotate-cw"></span></button>
      <button id="flip-h" class="ib" aria-label="Flip horizontally"><span class="ic" data-icon="flip-h"></span></button>
      <button id="flip-v" class="ib" aria-label="Flip vertically"><span class="ic" data-icon="flip-v"></span></button>
      <button id="orient-mode"><span class="ic" data-icon="compass"></span><span class="lbl">Standard</span></button>
    </div>

    <div class="group">
      <button id="cine" class="ib" aria-label="Play or pause cine"><span class="ic" data-icon="play"></span></button>
    </div>

    <div class="group" id="volume-wrap" hidden>
      <button id="vol-prev" class="ib" aria-label="Previous volume"><span class="ic" data-icon="chevron-left"></span></button>
      <input id="vol-slider" type="range" min="1" max="1" value="1" aria-label="Volume" />
      <button id="vol-next" class="ib" aria-label="Next volume"><span class="ic" data-icon="chevron-right"></span></button>
      <span id="vol-label">Volume 1 / 1</span>
      <button id="timecourse" class="tool ib" data-tool="timecourse" aria-label="Time course of a voxel" title="Time course: click a voxel to plot its value through all volumes"><span class="ic" data-icon="activity"></span></button>
    </div>

    <div class="group" id="cine-wrap" hidden>
      <button id="loop-in" class="ib" aria-label="Loop start"><span class="ic" data-icon="mark-in"></span></button>
      <button id="loop-out" class="ib" aria-label="Loop end"><span class="ic" data-icon="mark-out"></span></button>
      <button id="pingpong" class="ib" aria-label="Ping-pong playback"><span class="ic" data-icon="pingpong"></span></button>
      <button id="bookmark" class="ib" aria-label="Bookmark this frame"><span class="ic" data-icon="bookmark"></span></button>
    </div>

    <div class="group end">
      <button id="info"><span class="ic" data-icon="info"></span><span class="lbl">Full</span></button>
      <button id="anonymize" class="ib" aria-label="Anonymize"><span class="ic" data-icon="eye-off"></span></button>
      <button id="tags-btn" class="ib" aria-label="DICOM tags"><span class="ic" data-icon="list"></span></button>
      <button id="plugins-open" class="ib" aria-label="Plugins"><span class="ic" data-icon="plug"></span></button>
      <button id="settings-open" class="ib" aria-label="Settings"><span class="ic" data-icon="cog"></span></button>
    </div>

    <!-- Options of the current mode (MPR, 3D, angiography, cine); empty groups hide themselves -->
    <div id="context-bar" role="toolbar" aria-label="Mode options">
      <div class="group" id="mpr-tools">
        <button id="cross" class="tool ib" data-tool="cross" aria-label="Crosshair" hidden><span class="ic" data-icon="locate"></span></button>
        <button id="rotate" class="tool ib" data-tool="rotate" aria-label="Rotate MPR planes" hidden><span class="ic" data-icon="orbit"></span></button>
        <button id="reset-rot" class="ib" aria-label="Reset MPR rotation" hidden><span class="ic" data-icon="undo"></span></button>
        <select id="slab-mode" aria-label="Slab projection" hidden>
          <option value="none">Thin</option>
          <option value="max">MIP</option>
          <option value="min">MinIP</option>
          <option value="mean">Average</option>
        </select>
        <select id="slab-thick" aria-label="Slab thickness" hidden>
          <option value="3">3 mm</option>
          <option value="5">5 mm</option>
          <option value="10" selected>10 mm</option>
          <option value="20">20 mm</option>
          <option value="40">40 mm</option>
          <option value="80">80 mm</option>
          <option value="1000000">Full</option>
        </select>
      </div>
      <div class="group" id="view3d-tools">
        <button id="mip-view" class="ib" aria-label="3D view" hidden><span class="ic" data-icon="globe"></span></button>
        <button id="planes3d" aria-label="Show the MPR planes in the 3D view" hidden><span class="lbl">Planes</span></button>
        <select id="view3d" aria-label="3D view" hidden>
          <option value="max">MIP</option>
          <option value="min">MinIP</option>
          <option value="mean">Average</option>
          <option value="vr">Volume</option>
          <option value="surface">Surface</option>
        </select>
        <select id="vr-preset" aria-label="Volume rendering preset" hidden>
          <option value="generic">Generic</option>
          <optgroup label="CT">
            <option value="bone">Bone</option>
            <option value="vessel">Vessels (CTA)</option>
            <option value="soft">Soft tissue</option>
          </optgroup>
          <optgroup label="MR">
            <option value="mr">Tissue</option>
            <option value="mra">Bright vessels (MRA)</option>
          </optgroup>
          <optgroup label="X-ray">
            <option value="angio">Bright vessels</option>
            <option value="angio-dark">Dark vessels</option>
          </optgroup>
        </select>
        <select id="vr-thick" aria-label="Volume rendering thickness" hidden>
          <option value="Infinity" selected>Full</option>
          <option value="120">120 mm</option>
          <option value="60">60 mm</option>
          <option value="30">30 mm</option>
          <option value="15">15 mm</option>
        </select>
        <div id="surf-wrap" class="pop-wrap" hidden>
          <button id="surf-settings" aria-haspopup="true" aria-expanded="false"><span class="ic" data-icon="sliders"></span><span class="lbl">Surface</span></button>
          <div id="surf-pop" class="pop" role="dialog" aria-label="Surface settings" hidden>
            <label class="pop-row"><span>Lowest value</span>
              <input id="surf-thr" type="number" step="10" placeholder="Min" aria-label="Surface threshold" />
            </label>
            <label class="pop-row"><span>Highest value</span>
              <input id="surf-max" type="number" step="10" placeholder="Max" aria-label="Surface maximum" />
            </label>
            <label class="pop-row"><span>Parts</span>
              <select id="surf-part" aria-label="Parts of the surface">
                <option value="all">All parts</option>
                <option value="largest" selected>Largest part</option>
                <option value="at">Grow from crosshair</option>
              </select>
            </label>
            <label class="pop-row"><span>Smoothing</span>
              <select id="surf-smooth" aria-label="Smoothing of the surface">
                <option value="0">No smoothing</option>
                <option value="10" selected>Light smoothing</option>
                <option value="25">Medium smoothing</option>
                <option value="50">Strong smoothing</option>
              </select>
            </label>
            <label class="pop-row"><span>Detail</span>
              <select id="surf-detail" aria-label="Surface detail">
                <option value="0" selected>Auto detail</option>
                <option value="1">Fine</option>
                <option value="2">Medium</option>
                <option value="3">Coarse</option>
              </select>
            </label>
            <label class="pop-row"><span>Export axes</span>
              <select id="surf-coords" aria-label="Coordinates of the exported file">
                <option value="lps" selected>LPS (DICOM)</option>
                <option value="ras">RAS (Slicer)</option>
                <option value="volume">Volume axes</option>
              </select>
            </label>
          </div>
        </div>
        <button id="surf-update" aria-label="Build the surface again" hidden><span class="lbl">Update</span></button>
        <button id="surf-stl" aria-label="Save the surface as a file" hidden><span class="lbl">Export</span></button>
      </div>
      <div class="group" id="angio-wrap" hidden>
        <button id="dsa"><span class="ic" data-icon="subtract"></span><span class="lbl">DSA</span></button>
        <button id="mask-shift" class="tool ib" data-tool="maskshift" aria-label="Shift the mask" hidden><span class="ic" data-icon="move"></span></button>
        <select id="dsa-mask" aria-label="Mask frames" hidden>
          <option value="1">Mask: 1st frame</option>
          <option value="3">Mask: first 3</option>
          <option value="5">Mask: first 5</option>
          <option value="10">Mask: first 10</option>
          <option value="cur">Mask: this frame</option>
        </select>
        <select id="dsa-mode" aria-label="Subtraction mode" hidden>
          <option value="linear">Linear</option>
          <option value="log">Log</option>
        </select>
        <select id="tproj" aria-label="Projection over time">
          <option value="off">Frames</option>
          <option value="min">Min over time</option>
          <option value="max">Max over time</option>
          <option value="mean">Mean over time</option>
        </select>
      </div>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar">
      <h2>Series</h2>
      <ul id="series-list"></ul>
    </aside>

    <main id="stage">
      <div id="viewports" data-tool="window"></div>
      <div id="status"></div>
      <div id="tc-panel" hidden></div>
      <div id="slider-bar">
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="Image" />
      </div>
    </main>
  </div>

  <div id="settings-backdrop" hidden>
    <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="dialog-head">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" type="button">Close</button>
      </div>
      <div id="settings-layout">
        <nav id="settings-nav" aria-label="Settings sections"></nav>
        <div id="settings-body">
          <div id="settings-page" class="settings-page"></div>
          <div id="keys-page" class="settings-page" hidden>
            <div class="section-head">
              <h3>Keyboard shortcuts</h3>
              <button id="keys-reset-all" type="button">Reset all</button>
            </div>
            <div id="keys-notice" role="status"></div>
            <div id="keys-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tags-backdrop" hidden>
    <div id="tags" role="dialog" aria-modal="true" aria-labelledby="tags-title">
      <div class="dialog-head">
        <h2 id="tags-title">DICOM tags</h2>
        <button id="tags-close" type="button">Close</button>
      </div>
      <div id="tags-bar">
        <input id="tags-search" type="search" placeholder="Filter by tag, name or value" />
        <span id="tags-count"></span>
      </div>
      <div id="tags-note"></div>
      <div id="tags-list"></div>
    </div>
  </div>

    <div id="plugins-backdrop" hidden>
      <div id="plugins" role="dialog" aria-modal="true" aria-labelledby="plugins-title">
        <div class="dialog-head">
          <h2 id="plugins-title">Plugins</h2>
          <div class="head-actions">
            <button id="plugins-import-file" type="button">Import file…</button>
            <button id="plugins-import-folder" type="button">Import folder…</button>
            <button id="plugins-close" type="button">Close</button>
          </div>
        </div>
        <div id="plugins-note" role="status"></div>
        <div id="plugins-body">
          <ul id="plugins-list"></ul>
          <section id="plugins-detail"></section>
        </div>
      </div>
    </div>

    <div id="cal-backdrop" hidden>
    <div id="cal" role="dialog" aria-modal="true" aria-labelledby="cal-title">
      <div class="dialog-head"><h2 id="cal-title">Calibrate length</h2></div>
      <div id="cal-body">
        <div id="cal-info"></div>
        <div id="cal-row">
          <input id="cal-value" type="text" inputmode="decimal" placeholder="Real length" />
          <select id="cal-unit" aria-label="Unit">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
          </select>
        </div>
        <div id="cal-error" role="alert"></div>
        <div id="cal-note">
          Valid only where the object and the structure of interest are at the same distance
          from the detector. The result is an approximation, not a clinical measurement.
        </div>
        <div id="cal-actions">
          <button id="cal-cancel" type="button">Cancel</button>
          <button id="cal-ok" type="button" class="active">Calibrate</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
