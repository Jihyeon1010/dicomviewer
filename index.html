<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DICOM Viewer</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <button id="open-files">Open files</button>
      <button id="open">Open folder</button>
    </div>

    <div class="group" id="tools" role="toolbar" aria-label="Mouse tools">
      <button class="tool" data-tool="window" title="Window / Level (W)">W/L</button>
      <button class="tool" data-tool="pan" title="Pan (P)">Pan</button>
      <button class="tool" data-tool="zoom" title="Zoom (Z)">Zoom</button>
      <button class="tool" data-tool="scroll" title="Scroll (S)">Scroll</button>
    </div>

    <div class="group">
      <select id="preset" title="Window presets (1-6)"></select>
      <button id="invert" title="Invert (I)">Invert</button>
      <button id="fit" title="Fit to window (0)">Fit</button>
      <button id="reset" title="Reset window (R)">Reset</button>
    </div>

    <div class="group">
      <button id="info" title="Overlay detail: full / minimal / off (O)">Info: Full</button>
      <button id="markers" title="Orientation markers and scale bar (M)">Markers</button>
      <button id="anonymize" title="Hide patient identifiers on screen (A)">Anonymize</button>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar">
      <h2>Series</h2>
      <ul id="series-list"></ul>
    </aside>

    <main id="stage">
      <div id="viewport" class="empty" data-tool="window">
        <canvas id="view"></canvas>
        <div id="overlay-tl" class="overlay"></div>
        <div id="overlay-tr" class="overlay"></div>
        <div id="overlay-bl" class="overlay"></div>
        <div id="overlay-br" class="overlay"></div>
        <div id="marker-t" class="marker"></div>
        <div id="marker-b" class="marker"></div>
        <div id="marker-l" class="marker"></div>
        <div id="marker-r" class="marker"></div>
        <div id="scalebar">
          <div id="scalebar-label"></div>
          <svg id="scalebar-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="scalebar-path" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </div>
        <div id="scalebar-v">
          <svg id="scalebar-v-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="scalebar-v-path" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
          <div id="scalebar-v-label"></div>
        </div>
        <div id="status"></div>
        <div id="empty">
          <div id="empty-title">Drop DICOM files or a folder here</div>
          <div id="empty-sub">or use Open folder / Open files above</div>
        </div>
      </div>
      <div id="slider-bar">
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="Slice" />
      </div>
    </main>
  </div>
</body>
</html>
